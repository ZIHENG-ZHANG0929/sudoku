plugins { id 'com.android.application' }
android {
    namespace 'com.sudoku.hundred'
    compileSdk 34
    defaultConfig {
        applicationId 'com.sudoku.hundred'
        minSdk 24
        targetSdk 34
        versionCode 12
        versionName '3.1'
    }
    // Release signing is read from android/keystore.properties (not committed). Without it, the release APK is built unsigned.
    def ksFile = rootProject.file('keystore.properties')
    def ks = new Properties()
    if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }
    signingConfigs {
        release {
            if (ks.storeFile) {
                storeFile rootProject.file(ks.storeFile)
                storePassword ks.storePassword
                keyAlias ks.keyAlias
                keyPassword ks.keyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (ks.storeFile) signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
